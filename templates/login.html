{% extends "base.html" %}
{% block title %}Login - {{ name }}{% endblock %}
{% block content %}
<section class="projects-section" aria-labelledby="login-title">
  <div class="container auth-panel">
    <p class="section-kicker">Welcome back</p>
    <h1 id="login-title">Login</h1>
    <p class="form-help">
      Sign in to star projects. Portfolio pages remain public.
    </p>
    <form method="post" action="{% url 'main:login' %}" class="project-form">
      {% csrf_token %} {% include "components/form_fields.html" %}
      <button type="submit" class="button">Login</button>
    </form>
    <p class="auth-switch">
      No account yet? <a href="{% url 'main:register' %}">Register</a>
    </p>
  </div>
</section>
{% endblock %}
