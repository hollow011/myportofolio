<button
  type="button"
  class="button button-danger"
  popovertarget="delete-project-{{ project.pk }}"
  aria-label="Delete {{ project.title }}"
>
  Delete
</button>
<div
  id="delete-project-{{ project.pk }}"
  class="project-delete-modal"
  popover="auto"
  role="dialog"
  aria-labelledby="delete-title-{{ project.pk }}"
  aria-describedby="delete-description-{{ project.pk }}"
>
  <h2 id="delete-title-{{ project.pk }}">Delete project?</h2>
  <p id="delete-description-{{ project.pk }}">
    Delete <strong>{{ project.title }}</strong>? This cannot be undone.
  </p>
  <div class="form-actions">
    <button
      type="button"
      class="button button-secondary"
      autofocus
      popovertarget="delete-project-{{ project.pk }}"
      popovertargetaction="hide"
    >
      Cancel
    </button>
    <form method="post" action="{% url 'main:delete_project' project.pk %}">
      {% csrf_token %}
      <button type="submit" class="button button-danger">Yes, delete</button>
    </form>
  </div>
</div>
